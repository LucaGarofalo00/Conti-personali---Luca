<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FinanzApp" />
    <meta name="description" content="Fondi, spese ricorrenti, budget e previsione del saldo: le tue finanze personali, ancorate al giorno dello stipendio." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter caricato in modo NON bloccante: come <link rel="stylesheet"> normale il browser rimanda
      il primo disegno finché il CSS di terze parti non è arrivato — su rete mobile lenta è mezzo
      secondo di schermo bianco. Con media="print" il foglio si scarica a priorità bassa senza
      bloccare, e onload lo attiva. L'URL ha già display=swap, quindi il testo compare subito con il
      fallback di sistema e passa a Inter appena pronto; se JS è disabilitato interviene il noscript.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <title>FinanzApp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
