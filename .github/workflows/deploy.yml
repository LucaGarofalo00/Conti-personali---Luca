name: Deploy to GitHub Pages

on:
  push:
    branches: ['v.20']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # v5: le versioni @v4 di queste due azioni girano su Node 20, ormai deprecato sui runner
      # GitHub (avviso in ogni esecuzione). Cambia solo il runtime dell'azione, non il Node usato
      # per build e test, che resta quello impostato qui sotto.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # I 319 test coprono il motore finanziario (periodi, ricorrenze, previsione, arrotondamenti):
      # senza questo passo un errore di calcolo dei saldi arrivava in produzione senza fermare nulla.
      - run: npm test

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Senza questa variabile la build esce con la chiave VAPID vuota e le notifiche push
          # risultano non attivabili sul sito pubblicato, anche con la Edge Function già installata.
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
